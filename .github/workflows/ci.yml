name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # §14 "full E2E nightly" — 03:00 UTC.
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/storefront/coverage
            packages/shared/coverage
            packages/db/coverage
          retention-days: 14

      - name: Build
        run: pnpm build

  # §12 "Dependency scanning (Dependabot/Renovate + pnpm audit in CI)".
  # Dependabot itself runs from .github/dependabot.yml (its own schedule,
  # not a CI job). This reports known advisories on every push/PR without
  # failing the build on them — `pnpm audit`'s exit code reflects upstream
  # transitive advisories this repo often can't fix on its own schedule
  # (see docs/DECISIONS.md); a human reviews the report instead of CI
  # blocking merges on an advisory nobody's had a chance to triage yet.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (report only, non-blocking)
        run: pnpm audit --audit-level=high || true

  # §14 "API integration | Vitest + Supertest + real Postgres (CI service
  # container)" — not runnable in the sandbox this project was built in
  # (no live Postgres there, see docs/PROGRESS.md's running "Not verified
  # in this environment" note on every milestone), but fully real here:
  # a genuine Postgres 16 container, real migrations, real HTTP requests
  # against the real `AppModule` (apps/api/test/setup.ts).
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clothing_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_ecommerce_test?schema=public
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/clothing_ecommerce_test?schema=public
      STOREFRONT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      API_URL: http://localhost:4000
      APP_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1sb25nIQ==
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Base seed (roles, permissions, BD locations)
        run: pnpm db:seed
      - name: Integration tests
        run: pnpm test:integration

  # §14 "Playwright smoke on PRs to main (full E2E nightly)".
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clothing_ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_ecommerce_e2e?schema=public
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/clothing_ecommerce_e2e?schema=public
      STOREFRONT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      API_URL: http://localhost:4000
      APP_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1sb25nIQ==
      STORAGE_LOCAL_ROOT: ./.data/media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Base + demo seed
        run: pnpm db:seed && pnpm db:seed:demo
      - name: Build apps
        run: pnpm build
      - name: Start API
        run: pnpm --filter api start &
      - name: Start storefront
        run: pnpm --filter storefront start &
      - name: Start admin
        run: pnpm --filter admin start &
      - name: Wait for all three apps
        run: npx --yes wait-on@7 http://localhost:4000/health http://localhost:3000 http://localhost:3001 --timeout 60000
      - name: Playwright smoke (PRs to main)
        if: github.event_name != 'schedule'
        run: pnpm --filter e2e exec playwright test --grep @smoke
      - name: Playwright full suite (nightly)
        if: github.event_name == 'schedule'
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
