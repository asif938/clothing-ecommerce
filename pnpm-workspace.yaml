packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
# Native postinstall scripts explicitly allowlisted (pnpm blocks arbitrary
# install scripts by default). All well-known, required for their packages
# to function: Prisma's engine download, SWC/esbuild native binaries,
# unrs-resolver's native module, and Prisma's (anonymous, disableable)
# telemetry postinstall.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1001.5'
  - '@aws-sdk/client-s3@3.1155.0'
  - '@aws-sdk/core@3.978.5'
  - '@aws-sdk/credential-provider-env@3.972.76'
  - '@aws-sdk/credential-provider-http@3.972.78'
  - '@aws-sdk/credential-provider-ini@3.973.21'
  - '@aws-sdk/credential-provider-login@3.972.83'
  - '@aws-sdk/credential-provider-node@3.972.88'
  - '@aws-sdk/credential-provider-process@3.972.76'
  - '@aws-sdk/credential-provider-sso@3.973.20'
  - '@aws-sdk/credential-provider-web-identity@3.972.82'
  - '@aws-sdk/middleware-sdk-s3@3.972.81'
  - '@aws-sdk/nested-clients@3.997.50'
  - '@aws-sdk/s3-request-presigner@3.1155.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.49'
  - '@aws-sdk/token-providers@3.1155.0'
  - '@aws-sdk/types@3.975.0'
  - nodemailer@10.2.0
